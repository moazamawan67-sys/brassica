                const [message, setMessage] = useState(null);

                const [showDeleteModal, setShowDeleteModal] = useState(false);
                const [deletePassword, setDeletePassword] = useState('');
                const [deleteMode, setDeleteMode] = useState('all');
                const [itemToDelete, setItemToDelete] = useState(null);

                const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
                const [tareWt, setTareWt] = useState('');
                const [grossWt, setGrossWt] = useState('');
                const [stackNo, setStackNo] = useState('1');
                const [editingId, setEditingId] = useState(null);
                const [rejectMode, setRejectMode] = useState(false);

                const [showSearch, setShowSearch] = useState(false);
                const [showSeasonSummary, setShowSeasonSummary] = useState(() => {
                    const stored = localStorage.getItem('showSeasonSummary');
                    return stored ? JSON.parse(stored) : true;
                });
                
                const [showDailySummary, setShowDailySummary] = useState(() => {
                    const stored = localStorage.getItem('showDailySummary');
                    return stored ? JSON.parse(stored) : true;
                });
                
                const [searchFilters, setSearchFilters] = useState({ date: '', epNo: '', stackNo: '' });
                
                const [displayType, setDisplayType] = useState('current');
                const [displayStartDate, setDisplayStartDate] = useState('');
                const [displayEndDate, setDisplayEndDate] = useState('');
                const [displayStack, setDisplayStack] = useState('');

                const [exportType, setExportType] = useState('current');
                const [exportStartDate, setExportStartDate] = useState('');
                const [exportEndDate, setExportEndDate] = useState('');

                const seasonKey = useMemo(() => `${currentSeason.type}_${currentSeason.year}`, [currentSeason]);

                // Check authentication state on load
                useEffect(() => {
                    const checkUser = async () => {
                        setAuthLoading(true);
                        try {
                            // First check for existing session
                            const { data: { session: existingSession } } = await supabase.auth.getSession();
                            
                            if (existingSession) {
                                setSession(existingSession);
                                setUser(existingSession.user);
                                console.log('Existing session found:', existingSession.user.email);
                            }
                        } catch (error) {
                            console.error('Auth init error:', error);
                        } finally {
                            setAuthLoading(false);
                        }
                    };

                    checkUser();

                    // Listen for auth changes
                    const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
                        console.log('Auth state changed:', event, session?.user?.email);
                        setSession(session);
                        setUser(session?.user || null);
                        
                        if (event === 'SIGNED_IN') {
                            setAuthMessage({ type: 'success', text: 'کامیابی سے لاگ ان ہو گئے' });
                            setTimeout(() => setAuthMessage(null), 3000);
                        }
                        if (event === 'SIGNED_OUT') {
                            setAuthMessage({ type: 'info', text: 'لاگ آؤٹ ہو گئے' });
                            setEntries([]);
                            setTimeout(() => setAuthMessage(null), 3000);
                        }
                    });

                    return () => subscription.unsubscribe();
                }, []);

                useEffect(() => {
                    localStorage.setItem('showDailySummary', JSON.stringify(showDailySummary));
                }, [showDailySummary]);

                useEffect(() => {
                    localStorage.setItem('showSeasonSummary', JSON.stringify(showSeasonSummary));
                }, [showSeasonSummary]);

                // Auto-set tare weight when in reject mode and gross weight changes
                useEffect(() => {
                    if (rejectMode && grossWt) {
                        setTareWt(grossWt);
                    }
                }, [rejectMode, grossWt]);

                // Handle login/signup
                const handleAuth = async (email, password, mode) => {
                    setSubmitting(true);
                    setAuthMessage(null);

                    try {
                        if (mode === 'signup') {
                            const { data, error } = await supabase.auth.signUp({
                                email,
                                password,
                                options: {
                                    emailRedirectTo: window.location.origin
                                }
                            });

                            if (error) throw error;

                            // Check if email confirmation is required
                            if (data.user && data.session) {
                                // Immediate sign in after signup
                                setUser(data.user);
                                setSession(data.session);
                                setAuthMessage({ 
                                    type: 'success', 
                                    text: 'اکاؤنٹ کامیابی سے بن گیا اور آٹو لاگ ان ہو گئے!' 
                                });
                            } else if (data.user && !data.session) {
                                // Email confirmation required
                                setAuthMessage({ 
                                    type: 'info', 
                                    text: 'براہ کرم اپنے ای میل پر تصدیقی لنک پر کلک کریں۔' 
                                });
                                setAuthMode('login');
                            }
                        } else {
                            const { data, error } = await supabase.auth.signInWithPassword({
                                email,
                                password,
                            });

                            if (error) throw error;

                            setUser(data.user);
                            setSession(data.session);
                            setAuthMessage({ type: 'success', text: 'کامیابی سے لاگ ان ہو گئے' });
                        }
                    } catch (error) {
                        console.error('Auth error:', error);
                        
                        // Better error messages
                        let errorMessage = error.message;
                        if (error.message.includes('Invalid login credentials')) {
                            errorMessage = 'غلط ای میل یا پاسورڈ';
                        } else if (error.message.includes('Email not confirmed')) {
                            errorMessage = 'براہ کرم اپنے ای میل کی تصدیق کریں';
                        } else if (error.message.includes('User already registered')) {
                            errorMessage = 'یہ ای میل پہلے سے رجسٹرڈ ہے';
                        }
                        
                        setAuthMessage({ 
                            type: 'error', 
                            text: mode === 'signup' 
                                ? 'اکاؤنٹ بنانے میں ناکامی: ' + errorMessage 
                                : 'لاگ ان میں ناکامی: ' + errorMessage 
                        });
                    } finally {
                        setSubmitting(false);
                    }
                };

                // Handle logout
                const handleLogout = async () => {
                    try {
                        const { error } = await supabase.auth.signOut();
                        if (error) throw error;
                        setUser(null);
                        setSession(null);
                        setEntries([]);
                        setAuthMessage({ type: 'info', text: 'لاگ آؤٹ ہو گئے' });
                    } catch (error) {
                        console.error('Logout error:', error);
                        setAuthMessage({ type: 'error', text: 'لاگ آؤٹ میں ناکامی: ' + error.message });
                    }
                };

                const isValidWeight = (weight) => {
                    const w = Number(weight);
                    if (!weight || isNaN(w)) return false;
                    const lastDigit = w % 10;
                    return lastDigit === 0 || lastDigit === 5;
                };

                const formatDate = (dateStr) => {
                    if (!dateStr) return '-';
                    const parts = dateStr.split('-');
                    if (parts.length !== 3) return dateStr;
                    const [year, month, day] = parts;
                    return `${day}/${month}/${year}`;
                };

                const getDisplayText = () => {
                    if (displayType === 'all') return 'تمام ڈیٹا (All Data)';
                    if (displayType === 'dateRange') {
                        if (displayStartDate && displayEndDate) return `${formatDate(displayStartDate)} to ${formatDate(displayEndDate)}`;
                        return 'Select Date Range below';
                    }
                    if (displayType === 'stack') {
                        return displayStack ? `Stack #${displayStack}` : 'All Stacks';
                    }
                    return `Today (${formatDate(date)})`;
                };

                const fetchData = useCallback(async () => {
                    if (!user) {
                        setEntries([]);
                        setLoading(false);
                        return;
                    }

                    setLoading(true);
                    try {
                        console.log("Fetching data for user:", user.id);
                        
                        const { data, error } = await supabase
                            .from(TABLE_NAME)
                            .select('*')
                            .eq('user_id', user.id)
                            .eq('season', seasonKey)
                            .order('ep_no', { ascending: true });

                        if (error) {
                            console.error("Supabase Error Details:", error);
                            throw error;
                        }
                        
                        console.log("Fetched Data:", data);
                        setEntries(data || []);
                    } catch (err) {
                        console.error("Fetch Data Error:", err);
                        setMessage({ 
                            type: 'error', 
                            text: 'ڈیٹا لوڈ کرنے میں ناکامی۔ ' + (err.message || 'براہ کرم صفحہ ریفریش کریں۔') 
                        });
                        setEntries([]);
                    } finally {
                        setLoading(false);
                    }
                }, [user, seasonKey]);

                useEffect(() => {
                    fetchData();
                    localStorage.setItem('currentSeason', JSON.stringify(currentSeason));
                }, [fetchData, currentSeason]);

                const stats = useMemo(() => {
                    const dailyEntries = entries.filter(e => e.date === date);
                    const totalNet = entries.reduce((sum, e) => sum + (e.net_wt || 0), 0);
                    
                    const daily = dailyEntries.reduce((acc, e) => ({
                        gross: acc.gross + (e.gross_wt || 0),
                        tare: acc.tare + (e.tare_wt || 0),
                        net: acc.net + (e.net_wt || 0),
                        count: acc.count + 1
                    }), { gross: 0, tare: 0, net: 0, count: 0 });

                    const stacks = entries.reduce((acc, e) => {
                        const s = e.stack_no || '1';
                        if (!acc[s]) acc[s] = { net: 0, count: 0 };
                        acc[s].net += e.net_wt || 0;
                        acc[s].count += 1;
                        return acc;
                    }, {});

                    return { totalNet, daily, stacks };
                }, [entries, date]);

                const searchResults = useMemo(() => {
                    const { date, epNo, stackNo } = searchFilters;
                    if (!date && !epNo && !stackNo) return [];

                    return entries.filter(entry => {
                        const matchDate = date ? entry.date === date : true;
                        const matchEp = epNo ? entry.ep_no.toString().includes(epNo) : true;
                        const matchStack = stackNo ? entry.stack_no === stackNo : true;
                        return matchDate && matchEp && matchStack;
                    });
                }, [entries, searchFilters]);

                const searchSummary = useMemo(() => {
                    if (searchResults.length === 0) return null;
                    return searchResults.reduce((acc, e) => ({
                        gross: acc.gross + (e.gross_wt || 0),
                        tare: acc.tare + (e.tare_wt || 0),
                        net: acc.net + (e.net_wt || 0),
                        count: acc.count + 1
                    }), { gross: 0, tare: 0, net: 0, count: 0 });
                }, [searchResults]);

                const handleDeleteClick = (id, e) => {
                    if (e) {
                        e.stopPropagation();
                        e.preventDefault();
                    }
                    setDeleteMode('single');
                    setItemToDelete(id);
                    setShowDeleteModal(true);
                };

                const handleDeleteConfirm = async () => {
                    if (deleteMode === 'all') {
                        await handleDeleteAll();
                    } else {
                        await handleSingleDelete();
                    }
                };

                const handleSingleDelete = async () => {
                    if (!itemToDelete) return;
                    try {
                        const { error } = await supabase
                            .from(TABLE_NAME)
                            .delete()
                            .eq('id', itemToDelete)
                            .eq('user_id', user.id);
                        
                        if (error) throw error;
                        
                        setMessage({ type: 'success', text: 'ریکارڈ حذف ہو گیا ہے۔' });
                        setEntries(prev => prev.filter(entry => entry.id !== itemToDelete));
                        setShowDeleteModal(false);
                        setItemToDelete(null);
                    } catch (err) {
                        console.error("Delete failed:", err);
                        setMessage({ type: 'error', text: 'حذف کرنے میں ناکامی: ' + err.message });
                    }
                };

                const handleDeleteAll = async () => {
                    if (deletePassword !== DELETE_PASSWORD) {
                        setMessage({ type: 'error', text: 'غلط پاسورڈ! ڈیٹا حذف نہیں کیا جا سکا۔' });
                        return;
                    }

                    try {
                        const { error } = await supabase
                            .from(TABLE_NAME)
                            .delete()
                            .eq('user_id', user.id)
                            .eq('season', seasonKey);
                            
                        if (error) throw error;
                        
                        setMessage({ type: 'success', text: 'تمام ریکارڈز حذف ہو گئے ہیں۔' });
                        setShowDeleteModal(false);
                        setDeletePassword('');
                        fetchData();
                    } catch (err) {
                        console.error(err);
                        setMessage({ type: 'error', text: 'حذف کرنے میں ناکامی۔' });
                    }
                };

                const handleSubmit = async (e) => {
                    e.preventDefault();
                    setSubmitting(true);
                    
                    const tare = rejectMode ? Number(grossWt) : Number(tareWt);
                    const gross = Number(grossWt);
                    const net = rejectMode ? 0 : gross - tare;

                    if (!gross) {
                        setMessage({ type: 'error', text: 'گراس وزن درج کریں۔' });
                        setSubmitting(false);
                        return;
                    }

                    if (!rejectMode) {
                        if (gross <= tare) {
                            setMessage({ type: 'error', text: 'وزن درست نہیں ہے۔ Gross وزن Tare سے زیادہ ہونا چاہیے۔' });
                            setSubmitting(false);
                            return;
                        }

                        if (!isValidWeight(gross) || !isValidWeight(tare) || !isValidWeight(net)) {
                            setMessage({ type: 'error', text: 'تمام وزن 5 کے بند میں ہونے چاہئیں۔' });
                            setSubmitting(false);
                            return;
                        }
                    }

                    try {
                        if (editingId) {
                            const { error } = await supabase
                                .from(TABLE_NAME)
                                .update({ 
                                    date, 
                                    gross_wt: gross, 
                                    tare_wt: tare, 
                                    net_wt: net, 
                                    stack_no: stackNo,
                                    rejected: rejectMode,
                                    app_id: APP_ID
                                })
                                .eq('id', editingId)
                                .eq('user_id', user.id);
                                
                            if (error) {
                                console.error("Update Error Details:", error);
                                throw new Error(`Update failed: ${error.message}`);
                            }
                            setMessage({ type: 'success', text: 'اپ ڈیٹ ہو گیا۔' });
                            setEditingId(null);
                        } else {
                            const maxEp = entries.length > 0 ? Math.max(...entries.map(e => e.ep_no || 0)) : 0;
                            const todayEntries = entries.filter(e => e.date === date);
                            const nextSr = todayEntries.length + 1;

                            const entryData = {
                                date, 
                                sr_no: nextSr, 
                                ep_no: maxEp + 1, 
                                gross_wt: gross, 
                                tare_wt: tare, 
                                net_wt: net,
                                rejected: rejectMode,
                                stack_no: stackNo, 
                                season: seasonKey, 
                                user_id: user.id,
                                app_id: APP_ID,
                                created_at: new Date().toISOString()
                            };

                            console.log("Inserting data:", entryData);

                            const { data, error } = await supabase
                                .from(TABLE_NAME)
                                .insert(entryData)
                                .select();
                            
                            if (error) {
                                console.error("Insert Error Details:", error);
                                throw new Error(`Insert failed: ${error.message}`);
                            }
                            
                            console.log("Insert successful, returned data:", data);
                            setMessage({ type: 'success', text: rejectMode ? 'ریجیکٹ انٹری محفوظ ہو گئی۔' : 'محفوظ ہو گیا۔' });
                        }
                        setGrossWt(''); 
                        setTareWt('');
                        setRejectMode(false);
                        fetchData();
                    } catch (err) {
                        console.error("Submit Error Details:", err);
                        setMessage({ type: 'error', text: 'غلطی: ' + err.message });
                    } finally {
                        setSubmitting(false);
                    }
                };

                const downloadCSV = () => {
                    let dataToExport = [];
                    let suffix = '';
                    
                    if (exportType === 'all') {
                        dataToExport = entries;
                        suffix = 'all';
                    } else if (exportType === 'dateRange') {
                        if (!exportStartDate || !exportEndDate) {
                            setMessage({ type: 'error', text: 'تاریخ منتخب کریں۔' });
                            return;
                        }
                        dataToExport = entries.filter(e => e.date >= exportStartDate && e.date <= exportEndDate);
                        suffix = `${exportStartDate}_to_${exportEndDate}`;
                    } else {
                        dataToExport = entries.filter(e => e.date === date);
                        suffix = date;
                    }

                    if (dataToExport.length === 0) {
                        setMessage({ type: 'error', text: 'ڈیٹا موجود نہیں' });
                        return;
                    }

                    const headers = ['SR No', 'Ep No', 'Date', 'Gross Wt', 'Tare Wt', 'Net Wt', 'Stack No', 'Season', 'Status'];
                    const rows = dataToExport.map(e => [
                        e.sr_no || 1, 
                        e.ep_no || 1, 
                        formatDate(e.date), 
                        e.gross_wt || 0, 
                        e.tare_wt || 0, 
                        e.net_wt || 0, 
                        e.stack_no || '1', 
                        SEASON_LABELS[e.season ? e.season.split('_')[0] : 'brassica'] || 'Unknown',
                        e.rejected ? 'REJECTED' : 'ACCEPTED'
                    ]);
                    
                    const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                    const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `data_${suffix}.csv`;
                    link.click();
                };

                const displayData = useMemo(() => {
                    if (displayType === 'all') return entries;
                    if (displayType === 'dateRange') {
                        if (!displayStartDate || !displayEndDate) return entries;
                        return entries.filter(e => e.date >= displayStartDate && e.date <= displayEndDate);
                    }
                    if (displayType === 'stack') {
                        if (!displayStack) return entries;
                        return entries.filter(e => e.stack_no === displayStack);
                    }
                    return entries.filter(e => e.date === date);
                }, [entries, displayType, displayStartDate, displayEndDate, displayStack, date]);

                const weightValidation = useMemo(() => ({
                    tare: rejectMode ? true : isValidWeight(tareWt),
                    gross: rejectMode ? true : isValidWeight(grossWt),
                    net: rejectMode ? true : isValidWeight(Number(grossWt) - Number(tareWt))
                }), [tareWt, grossWt, rejectMode]);

                // Show login form if not authenticated
                if (authLoading) {
                    return React.createElement('div', { className: 'min-h-screen flex items-center justify-center' },
                        React.createElement('div', { className: 'text-center' },
                            React.createElement(Loader2, { className: 'w-12 h-12 text-indigo-600 animate-spin mx-auto mb-4' }),
                            React.createElement('p', { className: 'text-gray-600' }, 'لوڈ ہو رہا ہے...')
                        )
                    );
                }

                if (!user) {
                    return React.createElement(LoginSignupForm, {
                        onLogin: handleAuth,
                        loading: submitting,
                        mode: authMode,
                        setMode: setAuthMode,
                        authMessage: authMessage
                    });
                }

                // Main app for authenticated users
                return React.createElement('div', { className: 'min-h-screen pb-12 font-roboto bg-gray-50 text-gray-800' },
                    // Header
                    React.createElement('header', { className: 'bg-gradient-to-r from-indigo-800 to-indigo-600 text-white p-4 shadow-lg mb-6 sticky top-0 z-40' },
                        React.createElement('div', { className: 'max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3' },
                            React.createElement('div', { className: 'text-center md:text-right' },
                                React.createElement('h1', { className: 'text-xl font-bold font-nastaliq' }, 'بلھے شاہ پیکجنگ ٹریکر'),
                                React.createElement('p', { className: 'text-sm opacity-80 mt-1' }, `${SEASON_LABELS[currentSeason.type]} ${currentSeason.year}`),
                                React.createElement('p', { className: 'text-xs opacity-60 mt-1' }, user.email)
                            ),
                            React.createElement('div', { className: 'flex flex-col md:flex-row gap-2 items-center' },
                                React.createElement('div', { className: 'flex gap-2 bg-white/10 p-1 rounded-lg' },
                                    React.createElement('select', {
                                        className: 'bg-indigo-900 rounded px-2 py-1 text-xs outline-none focus:ring-1 focus:ring-white',
                                        value: currentSeason.type,
                                        onChange: e => setCurrentSeason({...currentSeason, type: e.target.value})
                                    },
                                        Object.entries(SEASON_LABELS).map(([k,v]) => 
                                            React.createElement('option', { key: k, value: k }, v)
                                        )
                                    ),
                                    React.createElement('select', {
                                        className: 'bg-indigo-900 rounded px-2 py-1 text-xs outline-none focus:ring-1 focus:ring-white',
                                        value: currentSeason.year,
                                        onChange: e => setCurrentSeason({...currentSeason, year: Number(e.target.value)})
                                    },
                                        [0,1,2].map(i => 
                                            React.createElement('option', { key: i, value: 2025+i }, 2025+i)
                                        )
                                    )
                                ),
                                React.createElement('div', { className: 'flex gap-2' },
                                    React.createElement('button', {
                                        onClick: () => setShowSeasonSummary(!showSeasonSummary),
                                        className: `px-3 py-1 rounded text-sm font-medium flex items-center gap-1 transition-colors ${showSeasonSummary ? 'bg-white text-indigo-800' : 'bg-indigo-700 hover:bg-indigo-600'}`
                                    },
                                        React.createElement(BarChart3, { size: 16 }),
                                        ' سیزن'
                                    ),
                                    React.createElement('button', {
                                        onClick: () => setShowDailySummary(!showDailySummary),
                                        className: `px-3 py-1 rounded text-sm font-medium flex items-center gap-1 transition-colors ${showDailySummary ? 'bg-white text-indigo-800' : 'bg-indigo-700 hover:bg-indigo-600'}`
                                    },
                                        React.createElement(Calendar, { size: 16 }),
                                        ' آج'
                                    ),
                                    React.createElement('button', {
                                        onClick: () => setShowSearch(!showSearch),
                                        className: `px-3 py-1 rounded text-sm font-medium flex items-center gap-1 transition-colors ${showSearch ? 'bg-white text-indigo-800' : 'bg-indigo-700 hover:bg-indigo-600'}`
                                    },
                                        React.createElement(Search, { size: 16 }),
                                        ' تلاش'
                                    ),
                                    // Profile button
                                    React.createElement('button', {
                                        onClick: () => setShowProfileModal(true),
                                        className: 'px-3 py-1 rounded text-sm font-medium flex items-center gap-1 bg-white/20 hover:bg-white/30 transition-colors'
                                    },
                                        React.createElement(User, { size: 16 }),
                                        'پروفائل'
                                    ),
                                    // Logout button
                                    React.createElement('button', {
                                        onClick: handleLogout,
                                        className: 'px-3 py-1 rounded text-sm font-medium flex items-center gap-1 bg-red-500 hover:bg-red-600 transition-colors'
                                    },
                                        React.createElement(LogOut, { size: 16 }),
                                        'لاگ آؤٹ'
                                    )
                                )
                            )
                        )
                    ),

                    React.createElement('main', { className: 'max-w-6xl mx-auto px-4' },
                        message && React.createElement('div', {
                            className: `p-3 rounded-lg mb-4 text-center text-sm font-bold shadow-sm animate-fade-in flex items-center justify-center gap-2 ${message.type === 'error' ? 'bg-red-100 text-red-700 border border-red-200' : message.type === 'success' ? 'bg-green-100 text-green-700 border border-green-200' : 'bg-blue-100 text-blue-700 border border-blue-200'}`
                        },
                            message.text,
                            React.createElement('button', {
                                onClick: () => setMessage(null),
                                className: 'ml-2 hover:opacity-70'
                            },
                                React.createElement(RotateCcw, { size: 14 })
                            )
                        ),

                        showSeasonSummary && React.createElement(SeasonSummary, {
                            currentSeason,
                            entries,
                            stats
                        }),

                        // Total Net Card
                        React.createElement('div', {
                            className: 'bg-gradient-to-r from-indigo-800 to-indigo-600 text-white rounded-xl p-4 shadow-lg mb-4 text-center transform hover:scale-[1.01] transition-transform'
                        },
                            React.createElement('h2', { className: 'text-lg opacity-80 mb-1' }, 'کل مجموعی وزن'),
                            React.createElement('div', { className: 'text-4xl font-extrabold mb-2' },
                                `${stats.totalNet.toLocaleString()} `,

                                                            },
                                                                React.createElement('span', {
                                                                    className: `px-2 py-0.5 rounded-full text-[10px] font-bold border ${
                                                                        entry.rejected 
                                                                            ? 'bg-red-100 text-red-700 border-red-200' 
                                                                            : 'bg-gray-100 text-gray-700 border-gray-200'
                                                                    }`
                                                                }, entry.stack_no || '1')
                                                            ),
                                                            React.createElement('td', { className: 'p-2 text-center' },
                                                                entry.rejected ? 
                                                                    React.createElement('span', {
                                                                        className: 'bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded-full font-bold border border-red-200'
                                                                    }, 'ریجیکٹ') :
                                                                    React.createElement('span', {
                                                                        className: 'bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded-full font-bold border border-green-200'
                                                                    }, 'قبول')
                                                            ),
                                                            React.createElement('td', {
                                                                className: 'p-2 flex justify-center gap-2 whitespace-nowrap'
                                                            },
                                                                React.createElement('button', {
                                                                    onClick: () => { 
                                                                        setEditingId(entry.id); 
                                                                        setDate(entry.date); 
                                                                        setGrossWt(entry.gross_wt.toString()); 
                                                                        setTareWt(entry.tare_wt.toString()); 
                                                                        setStackNo(entry.stack_no || '1'); 
                                                                        setRejectMode(entry.rejected || false);
                                                                        window.scrollTo({ top: 0, behavior: 'smooth' }); 
                                                                    },
                                                                    className: 'text-blue-600 hover:text-blue-800 transition-colors bg-blue-50 hover:bg-blue-100 p-1 rounded',
                                                                    title: 'Edit'
                                                                },
                                                                    React.createElement(Edit2, { size: 16 })
                                                                ),
                                                                React.createElement('button', {
                                                                    type: 'button',
                                                                    onClick: (e) => handleDeleteClick(entry.id, e),
                                                                    className: 'text-red-500 hover:text-red-700 transition-colors bg-red-50 hover:bg-red-100 p-1 rounded',
                                                                    title: 'Delete'
                                                                },
                                                                    React.createElement(Trash2, { size: 16 })
                                                                )
                                                            )
                                                        )
                                                    ),
                                                    displayData.length === 0 && 
                                                        React.createElement('tr', null,
                                                            React.createElement('td', {
                                                                colSpan: 9,
                                                                className: 'p-6 text-center text-gray-400'
                                                            }, 'کوئی ڈیٹا موجود نہیں (No Data)')
                                                        )
                                                )
                                            )
                                        )
                                    ),

                                    // CSV Download
                                    React.createElement('div', {
                                        className: 'bg-white rounded-lg shadow-sm border border-gray-100 p-4 flex flex-col items-center'
                                    },
                                        React.createElement('div', { className: 'w-full max-w-xs' },
                                            React.createElement('select', {
                                                value: exportType,
                                                onChange: e => setExportType(e.target.value),
                                                className: 'w-full p-2 border rounded mb-2 text-xs bg-gray-50'
                                            },
                                                React.createElement('option', { value: 'current' }, "Export Today's Data"),
                                                React.createElement('option', { value: 'all' }, 'Export All Data'),
                                                React.createElement('option', { value: 'dateRange' }, 'Export Range')
                                            ),
                                            exportType === 'dateRange' && 
                                                React.createElement('div', { className: 'flex gap-2 mb-2' },
                                                    React.createElement('input', {
                                                        type: 'date',
                                                        value: exportStartDate,
                                                        onChange: e => setExportStartDate(e.target.value),
                                                        className: 'border p-1 rounded text-xs w-full'
                                                    }),
                                                    React.createElement('input', {
                                                        type: 'date',
                                                        value: exportEndDate,
                                                        onChange: e => setExportEndDate(e.target.value),
                                                        className: 'border p-1 rounded text-xs w-full'
                                                    })
                                                ),
                                            React.createElement('button', {
                                                onClick: downloadCSV,
                                                className: 'w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded shadow transition-all flex justify-center items-center gap-2 text-sm'
                                            },
                                                React.createElement(FileDown, { size: 16 }),
                                                'CSV ڈاؤن لوڈ'
                                            )
                                        )
                                    )
                                ),

                                React.createElement('div', { className: 'mt-8 text-center' },
                                    React.createElement('button', {
                                        onClick: () => { setDeleteMode('all'); setDeletePassword(''); setShowDeleteModal(true); },
                                        className: 'px-4 py-2 rounded-lg font-bold text-xs flex items-center gap-2 bg-red-100 hover:bg-red-200 text-red-700 mx-auto transition-colors border border-red-200'
                                    },
                                        React.createElement(Trash2, { size: 14 }),
                                        ' تمام ڈیٹا حذف کریں (Delete All)'
                                    )
                                )
                            )
                    ),

                    // Delete Modal
                    React.createElement(DeleteConfirmationModal, {
                        isOpen: showDeleteModal,
                        onClose: () => setShowDeleteModal(false),
                        onConfirm: handleDeleteConfirm,
                        password: deletePassword,
                        setPassword: setDeletePassword,
                        currentSeason,
                        mode: deleteMode
                    }),

                    // Profile Modal
                    React.createElement(ProfileModal, {
                        isOpen: showProfileModal,
                        onClose: () => setShowProfileModal(false),
                        user: user,
                        onUpdatePassword: () => {}
                    })
                );
            };

            // Render the app
            const root = createRoot(document.getElementById('root'));
            root.render(React.createElement(App));
        }).catch(error => {
            console.error('Error loading modules:', error);
            document.getElementById('root').innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-red-50">
                    <div class="text-center p-8">
                        <h1 class="text-2xl font-bold text-red-600 mb-4">Error Loading Application</h1>
                        <p class="text-gray-700">Failed to load required modules. Please check your internet connection and refresh the page.</p>
                        <button onclick="window.location.reload()" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">
                            Refresh Page
                        </button>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
